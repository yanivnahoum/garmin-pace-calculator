<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Garmin Intervals Fixture</title>
	<style>
        table {
            border-collapse: collapse;
            font-family: sans-serif;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
        }

        .IntervalsTable_selected__fixture {
            background: #ddd;
        }
	</style>
</head>

<body>
<div role="tablist">
	<button role="tab" aria-selected="true">Intervals</button>
</div>
<div class="Tabs_tabContent__fixture Tabs_tableContainer__fixture">
	<table class="IntervalsTable_table__fixture">
		<thead>
		<tr>
			<th class="IntervalsTable_headerItem__fixture"><span></span></th>
			<th class="IntervalsTable_headerItem__fixture"><span>Interval</span></th>
			<th class="IntervalsTable_headerItem__fixture"><span>Step Type</span></th>
			<th class="IntervalsTable_headerItem__fixture"><span>Lap</span></th>
			<th class="IntervalsTable_headerItem__fixture"><span>Time</span></th>
			<th class="IntervalsTable_headerItem__fixture"><span>Cumulative Time</span></th>
			<th class="IntervalsTable_headerItem__fixture"><span>Distance</span><br /><span>km</span></th>
			<th class="IntervalsTable_headerItem__fixture"><span>Avg Pace</span><br /><span>min/km</span></th>
			<th class="IntervalsTable_headerItem__fixture"><span>Avg HR</span><br /><span>bpm</span></th>
			<th class="IntervalsTable_headerItem__fixture"><span>Avg Power</span><br /><span>W</span></th>
			<th class="IntervalsTable_headerItem__fixture"><span>Calories</span></th>
		</tr>
		</thead>
		<tbody>
		<tr class="IntervalsTable_tableRow__fixture">
			<td class="IntervalsTable_tableRowItem__fixture"></td>
			<td class="IntervalsTable_tableRowItem__fixture">1</td>
			<td class="IntervalsTable_tableRowItem__fixture">Run</td>
			<td class="IntervalsTable_tableRowItem__fixture">1</td>
			<td class="IntervalsTable_tableRowItem__fixture">5:00</td>
			<td class="IntervalsTable_tableRowItem__fixture">5:00</td>
			<td class="IntervalsTable_tableRowItem__fixture">1.00</td>
			<td class="IntervalsTable_tableRowItem__fixture">5:00</td>
			<td class="IntervalsTable_tableRowItem__fixture">150</td>
			<td class="IntervalsTable_tableRowItem__fixture">200</td>
			<td class="IntervalsTable_tableRowItem__fixture">75</td>
		</tr>
		<tr class="IntervalsTable_tableRow__fixture">
			<td class="IntervalsTable_tableRowItem__fixture"></td>
			<td class="IntervalsTable_tableRowItem__fixture">2</td>
			<td class="IntervalsTable_tableRowItem__fixture">Run</td>
			<td class="IntervalsTable_tableRowItem__fixture">2</td>
			<td class="IntervalsTable_tableRowItem__fixture">5:00</td>
			<td class="IntervalsTable_tableRowItem__fixture">10:00</td>
			<td class="IntervalsTable_tableRowItem__fixture">1.00</td>
			<td class="IntervalsTable_tableRowItem__fixture">5:00</td>
			<td class="IntervalsTable_tableRowItem__fixture">160</td>
			<td class="IntervalsTable_tableRowItem__fixture">300</td>
			<td class="IntervalsTable_tableRowItem__fixture">80</td>
		</tr>
		</tbody>
		<tfoot></tfoot>
	</table>
</div>
<script>
	document.querySelector('tbody').addEventListener('click', (event) => {
		event.target.closest('tr')?.classList.toggle('IntervalsTable_selected__fixture');
	});
</script>
</body>

</html>
