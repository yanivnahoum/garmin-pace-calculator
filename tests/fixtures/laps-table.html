<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Garmin Laps Fixture</title>
	<style>
        table {
            border-collapse: collapse;
            font-family: sans-serif;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
        }

        .SortableTable_selected__fixture {
            background: #ddd;
        }
	</style>
</head>

<body>
<div role="tablist">
	<button role="tab" aria-selected="true">Laps</button>
</div>
<div class="Tabs_tabContent__fixture Tabs_tableContainer__fixture">
	<table class="SortableTable_table__fixture">
		<thead>
		<tr>
			<th class="SortableTable_headerItem__fixture">
				<div class="ActivitySplits_tableHeaderContainer__fixture"><span>Laps</span></div>
			</th>
			<th class="SortableTable_headerItem__fixture">
				<div class="ActivitySplits_tableHeaderContainer__fixture"><span>Time</span></div>
			</th>
			<th class="SortableTable_headerItem__fixture">
				<div class="ActivitySplits_tableHeaderContainer__fixture"><span>Cumulative Time</span></div>
			</th>
			<th class="SortableTable_headerItem__fixture">
				<div class="ActivitySplits_tableHeaderContainer__fixture">
					<span>Distance</span><br /><span>km</span></div>
			</th>
			<th class="SortableTable_headerItem__fixture">
				<div class="ActivitySplits_tableHeaderContainer__fixture"><span>Avg
								Pace</span><br /><span>min/km</span></div>
			</th>
			<th class="SortableTable_headerItem__fixture">
				<div class="ActivitySplits_tableHeaderContainer__fixture"><span>Avg
								HR</span><br /><span>bpm</span></div>
			</th>
			<th class="SortableTable_headerItem__fixture">
				<div class="ActivitySplits_tableHeaderContainer__fixture"><span>Avg
								Power</span><br /><span>W</span></div>
			</th>
			<th class="SortableTable_headerItem__fixture">
				<div class="ActivitySplits_tableHeaderContainer__fixture"><span>Calories</span></div>
			</th>
		</tr>
		</thead>
		<tbody>
		<tr class="SortableTable_tableRow__fixture">
			<td>1</td>
			<td>5:00</td>
			<td>5:00</td>
			<td>1.00</td>
			<td>5:00</td>
			<td>150</td>
			<td>200</td>
			<td>75</td>
		</tr>
		<tr class="SortableTable_tableRow__fixture">
			<td>2</td>
			<td>5:00</td>
			<td>10:00</td>
			<td>1.00</td>
			<td>5:00</td>
			<td>160</td>
			<td>300</td>
			<td>80</td>
		</tr>
		</tbody>
		<tfoot></tfoot>
	</table>
</div>
<script>
	document.querySelector('tbody').addEventListener('click', (event) => {
		event.target
			.closest('tr')
			?.querySelectorAll('td')
			.forEach((cell) => cell.classList.toggle('SortableTable_selected__fixture'));
	});
</script>
</body>

</html>
